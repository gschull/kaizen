<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)"/>
  <!-- Seedling/sprout icon -->
  <g fill="#ffffff">
    <!-- Stem -->
    <path d="M256 380 L256 280 Q256 240 280 220" stroke="#ffffff" stroke-width="24" fill="none" stroke-linecap="round"/>
    <!-- Left leaf -->
    <ellipse cx="200" cy="200" rx="60" ry="40" transform="rotate(-45 200 200)"/>
    <!-- Right leaf -->
    <ellipse cx="312" cy="200" rx="60" ry="40" transform="rotate(45 312 200)"/>
    <!-- Small leaf -->
    <ellipse cx="280" cy="260" rx="35" ry="25" transform="rotate(30 280 260)"/>
  </g>
  <!-- Ground line -->
  <ellipse cx="256" cy="400" rx="80" ry="15" fill="#ffffff" opacity="0.5"/>
</svg>
